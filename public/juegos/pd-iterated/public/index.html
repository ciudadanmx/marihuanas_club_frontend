<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Dilema Iterado (sin servidor)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="container">
  <h1 class="title">Prueba Motor de Reglas</h1>



  <div class="view-rule-section">
    <label for="view-rule-select" class="view-label">Ver Regla:</label>
    <select id="view-rule-select" class="control-select invisible"></select>
    <select id="strategyC" class="control-select"></select>
    <div id="view-rule-details" class="view-details"></div>
  </div>

  <hr>
  <h2 class="subtitle">Constructor Visual de Estrategias</h2>
  <div class="controls">
    <label class="control-group">
      <span>Oponente:</span>
      <select id="visual-opponent" class="control-select"></select>
    </label>
  </div>
  <div id="rules-container" class="rules-container"></div>
  <div class="controls">
    <button id="add-rule" class="btn btn-add">+ Añadir Regla</button>
    <label class="control-group">
      <span>Acción por defecto:</span>
      <select id="default-action" class="control-select">
        <option value="C">Cooperar</option>
        <option value="T">Traicionar</option>
        <option value="R">Aleatorio</option>
      </select>
    </label>
    <button id="run-simulation" class="btn">Probar Estrategia</button>
    <button id="save-strategy" class="btn btn-secondary">Guardar Estrategia</button>
    <button id="load-strategy" class="btn btn-secondary">Cargar Estrategia</button>

      <div class="controls">
    <label class="control-group">
      <span>Estrategia A:</span>
      <select id="strategyA" class="control-select"></select>
    </label>
    <label class="control-group">
      <span>Estrategia B:</span>
      <select id="strategyB" class="control-select"></select>
    </label>
    <button id="runCustom" class="btn">Probar Estrategia</button>
  </div>
  <pre id="output" class="output amarillo"></pre>

  <hr>
  </div>

  <hr>
  <h2 class="subtitle">Simulador de Torneo</h2>
  <div class="chart-container">
    <button id="run-tournament" class="btn">Ejecutar Torneo vs Predefinidas</button>
    <div class="chart-wrapper">
      <canvas id="scoreChart"></canvas>
      <div class="legend" id="chart-legend"></div>
    </div>
  </div>
  <pre id="tournamentOutput" class="output tournament-output"></pre>
  <h3 class="subtitle">Detalle por Ronda</h3>
  <div id="step-by-step" class="tabs"></div>

  <script src="scripts/strategies.js"></script>
  <script src="scripts/builder.js"></script>
</body>
</html>
