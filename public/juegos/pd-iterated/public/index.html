<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Dilema Iterado (sin servidor)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Prueba Motor de Reglas</h1>

  <label>
    Estrategia A:
    <select id="strategyA"></select>
  </label>
  <label>
    Estrategia B:
    <select id="strategyB"></select>
  </label>
  <button id="runCustom">Probar Estrategia</button>
  <pre id="output"></pre>

  <hr>

  <label for="view-rule-select">Ver Regla:</label>
<select id="view-rule-select"></select>
<select id="strategyC"></select>
<div id="view-rule-details" style="margin-top:8px;"></div>

<hr>

  <h2>Constructor Visual de Estrategias</h2>
  <div id="rules-container"></div>
  <button id="add-rule">+ Añadir Regla</button>
  <label>Acción por defecto:
    <select id="default-action">
      <option value="C">Cooperar</option>
      <option value="T">Traicionar</option>
      <option value="R">Aleatorio</option>
    </select>
  </label>
  <button id="run-simulation">Probar Estrategia</button>



  <!-- Controles de guardado/carga (si los implementas) -->
  <button id="save-strategy">Guardar Estrategia</button>
  <button id="load-strategy">Cargar Estrategia</button>

  <hr>
  <h2>Simulador de Torneo</h2>
  <button id="run-tournament">Ejecutar Torneo vs Predefinidas</button>
  <canvas id="scoreChart" width="600" height="300"></canvas>
  <pre id="tournamentOutput"></pre>
  <h3>Detalle por Ronda</h3>
  <div id="step-by-step"></div>

  <!-- Carga primero las estrategias, luego el builder -->
  <script src="scripts/strategies.js"></script>
  <script src="scripts/builder.js"></script>

</body>
</html>
